name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS application
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package iKurd-compatible unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Daftar Qarz" Payload/App.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName DaftarQarz" Payload/App.app/Info.plist
          plutil -convert xml1 Payload/App.app/Info.plist
          /usr/bin/zip -0 -q -r DaftarQarz-iKurd.ipa Payload
          unzip -t DaftarQarz-iKurd.ipa

      - name: Upload iKurd-compatible IPA
        uses: actions/upload-artifact@v4
        with:
          name: DaftarQarz-iKurd
          path: DaftarQarz-iKurd.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct Safari download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete-asset latest DaftarQarz-iKurd.ipa --yes 2>/dev/null || true
            gh release upload latest DaftarQarz-iKurd.ipa --clobber
          else
            gh release create latest DaftarQarz-iKurd.ipa --title "Daftar Qarz IPA" --notes "Unsigned iKurd-compatible IPA."
          fi
